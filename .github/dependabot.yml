version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # First, because Dependabot puts a dependency in the first group it
      # matches. A new @milepost/* version is a contract interface change and
      # should arrive as its own PR, not inside a batch of tooling bumps.
      milepost-bindings:
        patterns:
          - "@milepost/*"
      indexer-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-dependencies:
        patterns:
          - "*"
